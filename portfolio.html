<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Personal project portfolio grid. Explore details and live demos of AI applications, software engineering, and technical projects.">
    <title>Portfolio - Project Collection</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/can-icon.svg">
</head>

<body>
    <div id="app" v-cloak>
        <!-- Navigation Header -->
        <header :class="{ 'scrolled': scrolled }">
            <nav>
                <a href="index.html#home" class="logo">
                    <img src="img/can-icon.svg" alt="Can Logo" style="height: 32px; width: 32px; vertical-align: middle; margin-right: 8px;">
                    Big Kuan
                </a>
                <ul class="nav-links" :class="{ 'active': menuActive }">
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#portfolio" class="active">Portfolio</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
                <div class="menu-toggle" @click="toggleMenu">
                    <i :class="menuActive ? 'fas fa-times' : 'fas fa-bars'"></i>
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="portfolio-page">
            <h1 class="section-title" ref="pageTitle">Project Collection</h1>

            <!-- Filter Buttons -->
            <div class="filter-container">
                <button v-for="cat in categories" :key="cat" @click="setFilter(cat)"
                    :class="['filter-btn', { 'active': filterCategory === cat }]">
                    {{ cat }}
                </button>
            </div>

            <!-- Grid Content -->
            <div class="portfolio-grid">
                <div v-for="(item, index) in filteredItems" :key="index" class="portfolio-card glass-panel">
                    <div class="portfolio-thumb">
                        <img :src="item.image" :alt="item.title">
                    </div>
                    <div class="portfolio-info">
                        <span class="portfolio-category">{{ item.category }}</span>
                        <h3 class="portfolio-title">{{ item.title }}</h3>
                        <p class="portfolio-excerpt">{{ item.excerpt }}</p>
                        <div class="portfolio-actions">
                            <button @click="openModal(item)" class="portfolio-btn-view">Details</button>
                            <a v-if="item.demoLink" :href="item.demoLink" target="_blank"
                                class="portfolio-btn-demo">Live Demo</a>
                            <a v-if="item.githubLink" :href="item.githubLink" target="_blank"
                                class="portfolio-btn-github"><i class="fab fa-github"></i> GitHub</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Glassmorphic Modal Detail View -->
        <div v-if="selectedItem" class="modal-overlay" @click="closeModal">
            <div class="modal-wrapper glass-panel" @click.stop>
                <button class="modal-close-btn" @click="closeModal">&times;</button>
                <div class="modal-body">
                    <img :src="selectedItem.image" :alt="selectedItem.title" class="modal-image">
                    <div class="modal-meta">
                        <span class="modal-tag">{{ selectedItem.category }}</span>
                    </div>
                    <h2 class="modal-title">{{ selectedItem.title }}</h2>
                    <p class="modal-description" v-html="selectedItem.description"></p>
                    <div class="modal-actions" style="display:flex; justify-content:flex-end; gap: 12px;">
                        <a v-if="selectedItem.githubLink" :href="selectedItem.githubLink" target="_blank"
                            class="portfolio-btn-github"
                            style="padding: 12px 24px; font-size:14px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-transform: uppercase; font-family: var(--font-headings); font-weight: 700;"><i class="fab fa-github"></i> GitHub</a>
                        <a v-if="selectedItem.demoLink" :href="selectedItem.demoLink" target="_blank"
                            class="btn-primary"
                            style="opacity:1; transform:none; padding: 12px 28px; font-size:14px; margin: 0;">Launch Demo</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-socials">
                <a href="https://github.com/bigkuan-chen" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:eagle.chen@gmail.com"><i class="fas fa-envelope"></i></a>
            </div>
            <p>&copy; {{ currentYear }} by CHEN KUAN LIANG. All rights reserved.</p>
        </footer>
    </div>

    <!-- Vue 3 and GSAP CDNs -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    scrolled: false,
                    menuActive: false,
                    currentYear: new Date().getFullYear(),
                    filterCategory: 'All',
                    selectedItem: null,
                    categories: ['All', 'Machine Learning', 'Security & Cryptography', 'AI & Data Science'],
                    portfolioItems: [
                        {
                            title: '十大機器學習演算法互動學習平台',
                            category: 'Machine Learning',
                            image: 'img/top10ml-thumb.png',
                            excerpt: '本專案將 24MB 包含大量圖片的靜態報告，成功重構並轉換為 Next.js 與 FastAPI 架構的動態互動式機器學習學習平台。',
                            description: '本專案將一個 <strong>24MB 包含大量 Base64 嵌入圖片的靜態 HTML 研讀報告</strong>，成功重構並轉換為一個現代化、響應式且具備實時演算法運算能力的<strong>動態互動式機器學習學習平台</strong>。<br><br>平台採用 <strong>Next.js (前端)</strong> 與 <strong>FastAPI (後端)</strong> 架構，讓學習者不僅能閱讀理論，還能直接在瀏覽器中調整超參數，即時觀測 Scikit-learn 模型在二維空間中擬合的<strong>決策面 (Decision Boundary)</strong> 與評估指標變動。',
                            demoLink: 'https://top10mlalgorithm.vercel.app/',
                            githubLink: 'https://github.com/bigkuan-chen/top10mlalgorithm'
                        },
                        {
                            title: 'BigCanVault v2 - Web Password Vault Manager',
                            category: 'Security & Cryptography',
                            image: 'img/vault-thumb.png',
                            excerpt: '一個最先進的、零知識 (Zero-Knowledge) 的網頁密碼管理器，使用 WebAssembly (libsodium) 加密並以個人的 Google Drive 作為雲端儲存空間。',
                            description: 'BigCanVault v2 是一個最先進的、零知識 (Zero-Knowledge) 的網頁密碼管理器。基於 <strong>Next.js</strong>、<strong>TypeScript</strong> 與 <strong>libsodium-wrappers-sumo (WebAssembly)</strong> 開發，並以使用者個人的 <strong>Google Drive</strong> 作為加密資料儲存空間。<br><br>所有密鑰衍生、加解密流程皆在瀏覽器端 (Client-side) 完成，確保伺服器端（如 Vercel）絕不經手任何明文密碼或主金鑰。',
                            demoLink: 'https://bigcanvault-v2-git-main-eaglechen-9925s-projects.vercel.app/',
                            githubLink: 'https://github.com/bigkuan-chen/bigcanvault_v2'
                        },
                        {
                            title: 'AI WordPilot - 智慧英文單字學習系統',
                            category: 'AI & Data Science',
                            image: 'img/ai-wordpilot-thumb.png',
                            excerpt: '結合 Google Gemini 語意分析與間隔重複（Spaced Repetition）演算法的智慧英文單字學習系統。',
                            description: 'AI WordPilot 是一款結合 <strong>Google Gemini 語意分析</strong>與<strong>間隔重複（Spaced Repetition）演算法</strong>的智慧英文單字學習系統，專為提升單字記憶效率設計。<br><br><strong>核心功能特色：</strong><br>• <strong>AI 智慧單字查詢與解析</strong>：雙語詳細釋義、CEFR 難度分級、詞頻統計、語音朗讀（TTS）及相似與混淆字彙語境對比。<br>• <strong>我的單字與混淆字對比收藏</strong>：打造個人專屬單字庫與對比卡片。<br>• <strong>加權間隔重複複習系統</strong>：結合 SuperMemo-2 (SM2) 演算法設計，提供英翻中、中翻英、情境選字、相似字辨識等四種智慧題型，並依據自評記憶回饋動態調整複習天數，達到最高記憶維持率。<br>• <strong>現代跨平台架構</strong>：使用 <strong>Flutter & Riverpod</strong> 開發，Web 端支援 SharedPreferences 本地持久化快取，並整合 Google Gemini API 生成結構化單字資料。',
                            githubLink: 'https://github.com/bigkuan-chen/AIEngDic'
                        }
                    ]
                }
            },
            computed: {
                filteredItems() {
                    if (this.filterCategory === 'All') {
                        return this.portfolioItems;
                    }
                    return this.portfolioItems.filter(item => item.category === this.filterCategory);
                }
            },
            methods: {
                handleScroll() {
                    this.scrolled = window.scrollY > 50;
                },
                toggleMenu() {
                    this.menuActive = !this.menuActive;
                },
                setFilter(category) {
                    this.filterCategory = category;
                    // Trigger a re-evaluation of card entry transitions
                    this.$nextTick(() => {
                        this.animateCards();
                    });
                },
                openModal(item) {
                    this.selectedItem = item;
                    document.body.style.overflow = 'hidden'; // prevent background scrolling
                },
                closeModal() {
                    this.selectedItem = null;
                    document.body.style.overflow = 'auto'; // restore scrolling
                },
                animateCards() {
                    // Reset opacity and translate cards
                    gsap.fromTo('.portfolio-card',
                        { opacity: 0, scale: 0.9, y: 30 },
                        {
                            opacity: 1,
                            scale: 1,
                            y: 0,
                            duration: 0.6,
                            stagger: 0.1,
                            ease: "power2.out"
                        }
                    );
                },
                initAnimations() {
                    // Title and filter entrance animation
                    gsap.from(this.$refs.pageTitle, {
                        opacity: 0,
                        y: -30,
                        duration: 0.8,
                        ease: "power3.out"
                    });

                    gsap.from('.filter-btn', {
                        opacity: 0,
                        y: 15,
                        scale: 0.95,
                        duration: 0.6,
                        stagger: 0.08,
                        ease: "power2.out",
                        delay: 0.2
                    });

                    // Trigger card list animation
                    this.animateCards();
                }
            },
            mounted() {
                window.addEventListener('scroll', this.handleScroll);
                this.handleScroll(); // initial state check

                this.$nextTick(() => {
                    this.initAnimations();
                });
            },
            unmounted() {
                window.removeEventListener('scroll', this.handleScroll);
            }
        }).mount('#app');
    </script>
</body>

</html>
