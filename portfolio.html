<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Personal project portfolio grid. Explore details and live demos of AI applications, software engineering, and technical projects.">
    <title>Portfolio - Project Collection</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/can-icon.svg">
</head>

<body>
    <div id="app" v-cloak>
        <!-- Navigation Header -->
        <div id="header-placeholder"></div>

        <!-- Main Content -->
        <main class="portfolio-page">

            <!-- Filter Buttons -->
            <div class="filter-container">
                <button v-for="cat in categories" :key="cat" @click="setFilter(cat)"
                    :class="['filter-btn', { 'active': filterCategory === cat }]">
                    {{ cat }}
                </button>
            </div>

            <!-- Grid Content -->
            <div class="portfolio-grid">
                <div v-for="(item, index) in filteredItems" :key="index" class="portfolio-card glass-panel">
                    <div class="portfolio-thumb">
                        <img :src="item.image" :alt="item.title">
                    </div>
                    <div class="portfolio-info">
                        <span class="portfolio-category">{{ item.category }}</span>
                        <h3 class="portfolio-title">{{ item.title }}</h3>
                        <p class="portfolio-excerpt">{{ item.excerpt }}</p>
                        <div class="portfolio-actions">
                            <button @click="openModal(item)" class="portfolio-btn-view">Details</button>
                            <a v-if="item.demoLink" :href="item.demoLink" target="_blank"
                                class="portfolio-btn-demo">Live Demo</a>
                            <a v-if="item.githubLink" :href="item.githubLink" target="_blank"
                                class="portfolio-btn-github"><i class="fab fa-github"></i> GitHub</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Glassmorphic Modal Detail View -->
        <div v-if="selectedItem" class="modal-overlay" @click="closeModal">
            <div class="modal-wrapper glass-panel" @click.stop>
                <button class="modal-close-btn" @click="closeModal">&times;</button>
                <div class="modal-body">
                    <img :src="selectedItem.image" :alt="selectedItem.title" class="modal-image">
                    <div class="modal-meta">
                        <span class="modal-tag">{{ selectedItem.category }}</span>
                    </div>
                    <h2 class="modal-title">{{ selectedItem.title }}</h2>
                    <p class="modal-description" v-html="selectedItem.description"></p>
                    <div class="modal-actions" style="display:flex; justify-content:flex-end; gap: 12px;">
                        <a v-if="selectedItem.githubLink" :href="selectedItem.githubLink" target="_blank"
                            class="portfolio-btn-github"
                            style="padding: 12px 24px; font-size:14px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-transform: uppercase; font-family: var(--font-headings); font-weight: 700;"><i
                                class="fab fa-github"></i> GitHub</a>
                        <a v-if="selectedItem.demoLink" :href="selectedItem.demoLink" target="_blank"
                            class="btn-primary"
                            style="opacity:1; transform:none; padding: 12px 28px; font-size:14px; margin: 0;">Launch
                            Demo</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Vue 3 and GSAP CDNs -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

    <script>
        const { createApp } = Vue;

        Promise.all([initHeader(), initFooter()]).then(() => {
            createApp({
                mixins: [headerMixin],
            data() {
                return {
                    scrolled: false,
                    menuActive: false,
                    currentYear: new Date().getFullYear(),
                    filterCategory: 'All',
                    selectedItem: null,
                    categories: ['All', 'Machine Learning', 'Security and Cryptography', 'AI and Data Science', 'Web Applications & Games', 'Automation and Tools'],
                    portfolioItems: [
                        {
                            title: '十大機器學習演算法互動學習平台',
                            category: 'Machine Learning',
                            image: 'img/top10ml-thumb.png',
                            excerpt: '本專案將 24MB 包含大量圖片的靜態報告，成功重構並轉換為 Next.js 與 FastAPI 架構的動態互動式機器學習學習平台。',
                            description: '本專案將一個 <strong>24MB 包含大量 Base64 嵌入圖片的靜態 HTML 研讀報告</strong>，成功重構並轉換為一個現代化、響應式且具備實時演算法運算能力的<strong>動態互動式機器學習學習平台</strong>。<br><br>平台採用 <strong>Next.js (前端)</strong> 與 <strong>FastAPI (後端)</strong> 架構，讓學習者不僅能閱讀理論，還能直接在瀏覽器中調整超參數，即時觀測 Scikit-learn 模型在二維空間中擬合的<strong>決策面 (Decision Boundary)</strong> 與評估指標變動。',
                            demoLink: 'https://top10mlalgorithm.vercel.app/',
                            githubLink: 'https://github.com/bigkuan-chen/top10mlalgorithm'
                        },
                        {
                            title: 'Web Password Vault Manager - 網頁密碼管理工具',
                            category: 'Security and Cryptography',
                            image: 'img/vault-thumb.png',
                            excerpt: '一個最先進的的網頁密碼管理器，使用 WebAssembly (libsodium) 加密並以個人的 Google Drive 作為雲端儲存空間。',
                            description: 'BigCanVault v2 是一個最先進的的網頁密碼管理器。基於 <strong>Next.js</strong>、<strong>TypeScript</strong> 與 <strong>libsodium-wrappers-sumo (WebAssembly)</strong> 開發，並以使用者個人的 <strong>Google Drive</strong> 作為加密資料儲存空間。<br><br>所有密鑰衍生、加解密流程皆在瀏覽器端 (Client-side) 完成，確保伺服器端（如 Vercel）絕不經手任何明文密碼或主金鑰。<br><br><strong>核心加密與安全機制：</strong><br>• <strong>金鑰衍生 (KDF)</strong>：使用 <strong>Argon2id</strong> 演算法 (<code>crypto_pwhash</code>)。隨機鹽值 (Salt) 為 16 bytes，操作限制 (Opslimit) 為 2，記憶體限制 (Memlimit) 為 64MB。採用 <code>libsodium-wrappers-sumo</code> 於瀏覽器 WebAssembly 環境中高效執行金鑰衍生。<br>• <strong>對稱加密 (AEAD)</strong>：採用 <strong>XChaCha20-Poly1305</strong> 演算法 (<code>crypto_aead_xchacha20poly1305_ietf_encrypt</code>)。每次存檔皆重新生成 24 bytes 的隨機隨機數 (Nonce)，確保極致的資料機密性與完整性。<br>• <strong>帳號雜湊與驗證</strong>：使用 <strong>SHA-256</strong> 對標準化的帳號進行雜湊處理，作為密碼庫的擁有者識別碼。<br>• <strong>Google Drive 隱私防護</strong>：使用 <code>drive.appdata</code> 權限範圍，僅能存取該帳號底下由應用程式建立的隱藏資料空間 (Application Data Folder)，防止用戶誤刪檔案。同時具備覆蓋驗證保護 (Overwrite Protection) 與備份匯入校驗機制。',
                            demoLink: 'https://bigcanvault-v2-git-main-eaglechen-9925s-projects.vercel.app/',
                            githubLink: 'https://github.com/bigkuan-chen/bigcanvault_v2'
                        },
                        {
                            title: 'AI WordPilot - 智慧英文單字學習系統',
                            category: 'AI and Data Science',
                            image: 'img/ai-wordpilot-thumb.png',
                            excerpt: '結合大語言模型(LLM)的語意分析與間隔重複（Spaced Repetition）演算法的智慧英文單字學習系統。',
                            description: 'AI WordPilot 是一款結合 <strong>大語言模型(LLM)語意分析</strong>與<strong>間隔重複（Spaced Repetition）演算法</strong>的智慧英文單字學習系統，專為提升單字記憶效率設計。<br><br><strong>核心功能特色：</strong><br>• <strong>AI 智慧單字查詢與解析</strong>：雙語詳細釋義、CEFR 難度分級、詞頻統計、語音朗讀（TTS）及相似與混淆字彙語境對比。<br>• <strong>我的單字與混淆字對比收藏</strong>：打造個人專屬單字庫與對比卡片。<br>• <strong>加權間隔重複複習系統</strong>：結合 SuperMemo-2 (SM2) 演算法設計，提供英翻中、中翻英、情境選字、相似字辨識等四種智慧題型，並依據自評記憶回饋動態調整複習天數，達到最高記憶維持率。<br>• <strong>現代跨平台架構</strong>：使用 <strong>Flutter & Riverpod</strong> 開發，Web 端支援 SharedPreferences 本地持久化快取，並整合 Google Gemini API 生成結構化單字資料。',
                            demoLink: 'https://ai-eng-axhwj6whw-eaglechen-9925s-projects.vercel.app/',
                            githubLink: 'https://github.com/bigkuan-chen/AIEngDic'
                        },
                        {
                            title: '圖書向量資料庫查詢與匯入系統',
                            category: 'AI and Data Science',
                            image: 'img/books-vector-thumb.png',
                            excerpt: '基於 FastAPI 與 Next.js 的兩階段檢索（Retrieve & Rerank）圖書向量資料庫查詢與匯入系統，支援 Qdrant 向量檢索與 LLM 重新排序。',
                            description: '圖書向量資料庫查詢與匯入系統是一個結合語意搜尋與大語言模型評估的現代化圖書檢索平台。<br><br><strong>核心功能特色：</strong><br>• <strong>圖書向量資料庫匯入</strong>：支援上傳書籍 JSON 檔案，進行資料前置驗證（ISBN 重複、欄位完整性），並設定重複處理原則以批次匯入至 Qdrant 向量資料庫。<br>• <strong>自然語言語意檢索</strong>：利用 Sentence-Transformers 將查詢文本向量化，並透過 Qdrant 進行餘弦相似度模糊比對。<br>• <strong>中介資料精確篩選</strong>：支援針對語言、出版社、出版年份範圍與主題標籤的混合式中介資料篩選（Metadata Filtering）。<br>• <strong>LLM 重新排序與過濾 (Reranking)</strong>：將第一階段粗篩的候選書籍與使用者查詢傳送給 LLM 進行二次精確相關度評分，排除未達最低門檻的圖書並調整最終重排。<br>• <strong>詳細查詢統計與偵錯</strong>：以視覺化比例條展示向量檢索與 LLM 處理的防時佔比，並提供 Debug 面板檢視系統提示詞、模型輸入與原始輸出以利開發調優。<br>• <strong>現代技術架構</strong>：後端採用 <strong>FastAPI & Qdrant</strong>，前端使用 <strong>Next.js (App Router) & Tailwind CSS</strong> 開發，支援 Docker Compose 容器化部署。',
                            demoLink: 'https://books-vector-system.vercel.app/book-search',
                            githubLink: 'https://github.com/bigkuan-chen/books_vector_system'
                        },
                        {
                            title: 'Google Flights 機票降價追蹤通知器',
                            category: 'Automation and Tools',
                            image: 'img/flights-freedom-thumb.jpg',
                            excerpt: '基於 Python、SerpApi (Google Flights) 與 LINE / Brevo API 的機票降價監控與自動通知系統，支援彈性區間搜尋與 GitHub Actions 自動化排程。',
                            description: 'Google Flights 機票降價追蹤通知器是一款基於 <strong>Python</strong> 開發的機票降價監控與自動通知系統。<br><br><strong>核心功能特色：</strong><br>• <strong>彈性雙重搜尋模式</strong>：支援「單一日期」去回程追蹤與「區間彈性搜尋模式」（可設定長日期區間與旅遊天數，自動排列所有起迄組合，進行批量票價查詢與最低價排序推薦）。<br>• <strong>歷史票價追蹤與比對</strong>：整合本地 <strong>SQLite 資料庫</strong> 記錄每次查詢票價與連結，自動與同日期組合之歷史最低票價比對，精準判斷降價幅度。<br>• <strong>雙通道自動推播通知</strong>：當查得票價低於預設「理想預算」或低於「歷史最低價」時，自動透過 <strong>LINE Messaging API</strong> 推送私訊警報，並透過 <strong>Brevo (Sendinblue) Email API</strong> 發送精美的 HTML 格式化降價通知信。<br>• <strong>GitHub Actions 雲端自動化執行</strong>：支援設定定時排程（Cron Job），免用實體主機，自動運行並將更新後的 SQLite 資料庫提交回存至 GitHub 專案。',
                            demoLink: '',
                            githubLink: 'https://github.com/bigkuan-chen/flights_freedom'
                        },
                        {
                            title: 'Agar.io 網頁版遊戲專案',
                            category: 'Web Applications & Games',
                            image: 'img/agar-io-thumb.png',
                            excerpt: '基於 React 19、Next.js 16 與 HTML5 Canvas 的經典細胞吞噬遊戲，具備智慧 AI 機器人對戰、分裂與噴射機制，並整合 Drizzle D1/R2 與 SIWC 身分驗證。',
                            description: '本專案是一個基於網頁技術重建的經典 <strong>Agar.io（細胞吞噬）遊戲</strong>。玩家在遊戲中扮演一個小細胞，透過吞噬隨機分佈在地圖上的食物顆粒與比自己小的其他細胞（包括 24 個擁有智慧的 AI 機器人）來不斷壯大自己，同時需要避免被更大的細胞或綠色病毒吞噬。<br><br><strong>核心功能與技術特色：</strong><br>• <strong>高效 Canvas 渲染</strong>：所有細胞、食物、病毒與背景網格皆透過 HTML5 Canvas API 進行高效 2D 渲染，在大物體數量下依然能流暢保持高幀率。<br>• <strong>現代前端架構</strong>：採用 <strong>React 19 & Next.js 16</strong> 並透過 Vinext 輕量化適配器驅動，專為 Edge / Cloudflare Workers 環境優化。<br>• <strong>完整物理與控制機制</strong>：實現分裂（Split）、噴射質量（Eject）、質量衰減、吞噬判定及依細胞質量動態調整的移動速度公式。<br>• <strong>Drizzle ORM 與 Cloudflare 綁定</strong>：使用 Drizzle ORM，預先規劃並整合 <strong>Cloudflare D1 (SQL 資料庫)</strong> 與 <strong>R2 (對象儲存)</strong> 以記錄玩家歷史戰績與持久化數據。<br>• <strong>SIWC 身分驗證</strong>：整合 Sign-In With ChatGPT，能無縫驗證並取得 ChatGPT 工作區使用者資訊。',
                            demoLink: 'https://agar-arena-play.eagle-chen.chatgpt.site/',
                            githubLink: 'https://github.com/bigkuan-chen/kuan-agar.io.git'
                        }
                    
                    ]
                }
            },
            computed: {
                filteredItems() {
                    if (this.filterCategory === 'All') {
                        return this.portfolioItems;
                    }
                    return this.portfolioItems.filter(item => item.category === this.filterCategory);
                }
            },
            methods: {
                handleScroll() {
                    this.scrolled = window.scrollY > 50;
                },
                toggleMenu() {
                    this.menuActive = !this.menuActive;
                },
                setFilter(category) {
                    this.filterCategory = category;
                    // Trigger a re-evaluation of card entry transitions
                    this.$nextTick(() => {
                        this.animateCards();
                    });
                },
                openModal(item) {
                    this.selectedItem = item;
                    document.body.style.overflow = 'hidden'; // prevent background scrolling
                },
                closeModal() {
                    this.selectedItem = null;
                    document.body.style.overflow = 'auto'; // restore scrolling
                },
                animateCards() {
                    // Reset opacity and translate cards
                    gsap.fromTo('.portfolio-card',
                        { opacity: 0, scale: 0.9, y: 30 },
                        {
                            opacity: 1,
                            scale: 1,
                            y: 0,
                            duration: 0.6,
                            stagger: 0.1,
                            ease: "power2.out"
                        }
                    );
                },
                initAnimations() {
                    // Trigger card list animation
                    this.animateCards();
                }
            },
            mounted() {
                window.addEventListener('scroll', this.handleScroll);
                this.handleScroll(); // initial state check

                this.$nextTick(() => {
                    this.initAnimations();
                });
            },
            unmounted() {
                window.removeEventListener('scroll', this.handleScroll);
            }
        }).mount('#app');
    });
    </script>
</body>

</html>
