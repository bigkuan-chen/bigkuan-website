<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact - get in touch. Opportunities for collaboration, professional inquiries, and feedback.">
    <title>Contact - Get In Touch</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/can-icon.svg">
</head>

<body>
    <div id="app" v-cloak>
        <!-- Navigation Header -->
        <div id="header-placeholder"></div>

        <!-- Main Content -->
        <main class="contact-page">
            <div class="contact-card glass-panel" ref="contactCard">
                <h1>Let's Connect</h1>
                <p>I am always interested in discussing new opportunities, collaborating on innovative technical
                    projects, or answering questions about my project implementations.</p>

                <!-- Custom interactive email container -->
                <div class="contact-email">
                    <a href="mailto:eagle.chen@gmail.com" ref="emailLink" @mouseenter="animateEmail"
                        @mouseleave="resetEmail">
                        eagle.chen@gmail.com
                    </a>
                </div>

                <!-- Social links -->
                <div class="social-links">
                    <a href="https://github.com/bigkuan-chen" target="_blank" class="social-btn" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/kuanliang-chen/" target="_blank" class="social-btn"
                        aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="mailto:eagle.chen@gmail.com" class="social-btn" aria-label="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Vue 3 and GSAP CDNs -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

    <script>
        const { createApp } = Vue;

        Promise.all([initHeader(), initFooter()]).then(() => {
            createApp({
                mixins: [headerMixin],
                data() {
                    return {
                        scrolled: false,
                        menuActive: false,
                        currentYear: new Date().getFullYear()
                    }
                },
                methods: {
                    handleScroll() {
                        this.scrolled = window.scrollY > 50;
                    },
                    toggleMenu() {
                        this.menuActive = !this.menuActive;
                    },
                    animateEmail() {
                        gsap.to(this.$refs.emailLink, {
                            scale: 1.05,
                            textShadow: "0 0 15px rgba(6, 182, 212, 0.4)",
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    },
                    resetEmail() {
                        gsap.to(this.$refs.emailLink, {
                            scale: 1,
                            textShadow: "none",
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    },
                    initAnimations() {
                        // Stagger card elements on page load
                        gsap.from(this.$refs.contactCard, {
                            opacity: 0,
                            y: 40,
                            duration: 0.8,
                            ease: "power3.out"
                        });

                        gsap.from('h1, p', {
                            opacity: 0,
                            y: 20,
                            duration: 0.6,
                            stagger: 0.15,
                            ease: "power2.out",
                            delay: 0.15
                        });

                        gsap.from('.contact-email', {
                            opacity: 0,
                            scale: 0.9,
                            duration: 0.6,
                            ease: "power2.out",
                            delay: 0.4
                        });

                        gsap.from('.social-btn', {
                            opacity: 0,
                            y: 10,
                            scale: 0.8,
                            duration: 0.5,
                            stagger: 0.1,
                            ease: "back.out(1.7)",
                            delay: 0.5
                        });
                    }
                },
                mounted() {
                    window.addEventListener('scroll', this.handleScroll);
                    this.handleScroll(); // initial state check

                    this.$nextTick(() => {
                        this.initAnimations();
                    });
                },
                unmounted() {
                    window.removeEventListener('scroll', this.handleScroll);
                }
            }).mount('#app');
        });
    </script>
</body>

</html>
