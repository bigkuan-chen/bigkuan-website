<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 2 - Classification Console</title>
    <style>
        body {
            background-color: #0b111e;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: rgba(18, 27, 45, 0.7);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #06b6d4;
            margin-bottom: 20px;
        }
        p {
            color: #9ca3af;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #8b5cf6;
            font-weight: bold;
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }
        .ai-matrix-mockup {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 30px 0;
        }
        .matrix-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
        }
        .box-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .box-value {
            font-size: 24px;
            font-weight: bold;
            color: #06b6d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Homework 2: Classification Console</h1>
        <p>This is a placeholder for your AI/Machine learning classification system. When deploying, replace the content of this folder (<code>homework2/</code>) with your actual Homework 2 build files.</p>

        <!-- Metric matrices mockup -->
        <div class="ai-matrix-mockup">
            <div class="matrix-box">
                <div class="box-title">Accuracy</div>
                <div class="box-value">97.8%</div>
            </div>
            <div class="matrix-box">
                <div class="box-title">Recall</div>
                <div class="box-value">96.5%</div>
            </div>
            <div class="matrix-box">
                <div class="box-title">F1 Score</div>
                <div class="box-value">0.971</div>
            </div>
        </div>

        <a href="../portfolio.html" class="back-link">&larr; Back to Portfolio</a>
    </div>
</body>
</html>
