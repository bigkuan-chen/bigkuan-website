<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Homework 1 - Pathfinder Demo</title>
    <style>
        body {
            background-color: #0b111e;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: rgba(18, 27, 45, 0.7);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #8b5cf6;
            margin-bottom: 20px;
        }
        p {
            color: #9ca3af;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #06b6d4;
            font-weight: bold;
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: rgba(6, 182, 212, 0.1);
            border-color: #06b6d4;
            transform: translateY(-2px);
        }
        .grid-placeholder {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 20px 0 30px;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 2px;
        }
        .cell.active {
            background: #8b5cf6;
            box-shadow: 0 0 8px #8b5cf6;
        }
        .cell.path {
            background: #06b6d4;
            box-shadow: 0 0 8px #06b6d4;
        }
    </style>
</head>
