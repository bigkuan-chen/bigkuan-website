<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Personal portfolio and project collection website. Showcase of engineering, software development, and academic projects.">
    <title>Personal Portfolio & Project Showcase</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-body">
    <div id="app" v-cloak>
        <!-- Navigation Header -->
        <header :class="{ 'scrolled': scrolled }">
            <nav>
                <a href="index.html" class="logo">Big Kuan </a>
                <ul class="nav-links" :class="{ 'active': menuActive }">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="menu-toggle" @click="toggleMenu">
                    <i :class="menuActive ? 'fas fa-times' : 'fas fa-bars'"></i>
                </div>
            </nav>
        </header>

        <!-- Hero Landing Banner -->
        <section class="hero" style="background-image: url('img/hero-bg.png');">
            <div class="hero-content">
                <h1></h1>
                <h2>Welcome to my digital space. Here you will find my collection of projects and
                    engineering experimentations.</h2>
                <a href="portfolio.html" class="btn-primary">Explore Portfolio</a>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <div class="footer-socials">
                <a href="https://github.com/bigkuan-chen" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:eagle.chen@gmail.com"><i class="fas fa-envelope"></i></a>
            </div>
            <p>&copy; {{ currentYear }} by CHEN KUAN LIANG. All rights reserved.</p>
        </footer>
    </div>

    <!-- Vue 3 and GSAP CDNs -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    scrolled: false,
                    menuActive: false,
                    currentYear: new Date().getFullYear()
                }
            },
            methods: {
                handleScroll() {
                    this.scrolled = window.scrollY > 50;
                },
                toggleMenu() {
                    this.menuActive = !this.menuActive;
                },
                goToPortfolio() {
                    window.location.href = 'portfolio.html';
                },
                initAnimations() {
                    // Register ScrollTrigger plugin
                    gsap.registerPlugin(ScrollTrigger);

                    // Hero animations
                    gsap.to('.hero h1', {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        ease: "power3.out"
                    });

                    gsap.to('.hero h2', {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        delay: 0.25,
                        ease: "power3.out"
                    });

                    gsap.to('.hero .btn-primary', {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        delay: 0.5,
                        ease: "power3.out"
                    });

                    // Gallery Cards Entrance trigger
                    gsap.utils.toArray('.gallery-card').forEach((card, index) => {
                        gsap.to(card, {
                            opacity: 1,
                            scale: 1,
                            duration: 0.8,
                            scrollTrigger: {
                                trigger: card,
                                start: 'top bottom-=100',
                                toggleActions: 'play none none reverse'
                            },
                            delay: index * 0.15,
                            ease: "power3.out"
                        });
                    });
                }
            },
            mounted() {
                window.addEventListener('scroll', this.handleScroll);
                this.handleScroll(); // initial state check

                // Initialize GSAP animations on tick
                this.$nextTick(() => {
                    this.initAnimations();
                });
            },
            unmounted() {
                window.removeEventListener('scroll', this.handleScroll);
            }
        }).mount('#app');
    </script>
</body>

</html>
