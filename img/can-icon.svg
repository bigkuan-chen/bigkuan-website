<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic gradient for the can body -->
    <linearGradient id="bodyGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <!-- Highlight gradient for the ridges -->
    <linearGradient id="ridgeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pull Tab on Top -->
  <path d="M44 14 C44 8, 56 8, 56 14 C56 18, 51 18, 50 18 C49 18, 44 18, 44 14 Z" stroke="url(#ridgeGradient)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="2" fill="#00f5a0"/>

  <!-- Can Top Rim -->
  <ellipse cx="50" cy="24" rx="22" ry="5" fill="#0c101d" stroke="url(#ridgeGradient)" stroke-width="2"/>
  
  <!-- Can Body -->
  <path d="M28 24 C28 29, 72 29, 72 24 L72 74 C72 79, 28 79, 28 74 Z" fill="url(#bodyGradient)"/>
  
  <!-- Can Bottom Rim -->
  <ellipse cx="50" cy="74" rx="22" ry="5" fill="none" stroke="url(#ridgeGradient)" stroke-width="2"/>

  <!-- Cybernetic Grid / Grooves on the Can (representing a tin can's ribs) -->
  <path d="M29 36 C35 39, 65 39, 71 36" stroke="url(#ridgeGradient)" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <path d="M28.5 48 C35 51, 65 51, 71.5 48" stroke="url(#ridgeGradient)" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <path d="M28.5 60 C35 63, 65 63, 71.5 60" stroke="url(#ridgeGradient)" stroke-width="2" opacity="0.8" stroke-linecap="round"/>

  <!-- Glowing Center Tech Emblem (a stylized 'K' inside a shield/hexagon) -->
  <polygon points="50,42 58,47 58,57 50,62 42,57 42,47" fill="#0c101d" stroke="#00f5a0" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Stylized K shape -->
  <path d="M47 48 L47 56 M47 52 L52 48 M47 52 L52 56" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
</svg>
